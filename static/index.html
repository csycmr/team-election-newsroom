<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울선거라이브</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <div class="brand">서울선거라이브 <span>PROJECT 1</span></div>
      <h1>2026 서울시장 개표 상황판</h1>
      <p id="clock">2026년 6월 3일 · 제9회 전국동시지방선거</p>
    </div>
    <div class="header-actions">
      <strong class="badge">● 과거 선거 재생 시연</strong>
      <button id="start">개표 재생</button>
      <button id="pause" disabled>일시정지</button>
    </div>
  </header>
  <main>
    <div class="ticker"><b>개표 속보</b><span id="ticker">재생을 시작하면 5초마다 집계가 갱신돼요.</span></div>
    <div class="dashboard">
      <section class="panel">
        <h2>개표 전광판</h2>
        <div id="metrics" class="metrics">
          <div>개표 진행률<strong id="progress">—</strong></div>
          <div>집계 유효표<strong id="total">—</strong></div>
          <div>현재 1위<strong id="leader">—</strong></div>
          <div>1·2위 득표 차<strong id="gap">—</strong></div>
        </div>
        <p id="meta" class="muted">서울특별시 전체 · 12단계 재생</p>
        <a id="source" href="https://www.data.go.kr/data/15162288/fileData.do" target="_blank" rel="noopener">중앙선관위 원자료 안내 ↗</a>
      </section>
      <section class="panel">
        <h2>후보별 득표 현황</h2>
        <div id="bars" aria-live="off"></div>
      </section>
    </div>
    <div class="dashboard editorial">
      <section class="panel">
        <h2>뉴스룸 편집 데스크</h2>
        <p class="muted">집계가 도착하면 출처가 담긴 템플릿 초안을 작성해. 팩트체크와 사람 검토 후에 최종 승인할 수 있어.</p>
        <div class="actions">
          <button id="draft" disabled>현재 집계로 초안</button>
          <button id="check" disabled>팩트체크</button>
          <button id="review" disabled>사람 검토</button>
          <button id="approve" disabled>편집장 승인</button>
        </div>
        <label>검토자 이름 <input id="reviewer" placeholder="이름 입력"></label>
        <p id="status" role="status">개표 재생 대기</p>
        <h3 id="article-title"></h3>
        <p id="article-body"></p>
      </section>
      <section class="panel">
        <h2>근거 검색</h2>
        <form id="search-form"><input id="query" aria-label="검색어" value="서울시장 개표"><button>검색</button></form>
        <div id="evidence"></div>
      </section>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
